name: Build and tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Build and tests
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - name: Fetch dependencies
        run: mix deps.get --only test
      - name: Check formatting
        run: mix format --check-formatted
      - name: Launch tests
        run: mix test
