name: Build and tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Build and tests
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Fetch dependencies
        run: mix deps.get --only test
      - name: Launch tests
        run: mix test
  static-analysis:
    runs-on: ubuntu-latest
    name: Static analysis
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Cache PLT files and deps
        uses: actions/cache@v6
        with:
          path: |
            _build/dev/*.plt
            _build/dev/*.plt.hash
            deps/
          key: plt-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-
      - run: mix do deps.get + compile
      # Tests already run in the `test` job
      - run: mix check --except ex_unit
